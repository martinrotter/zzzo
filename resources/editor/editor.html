<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>HTML editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0px;
      padding: 0px;
    }
  </style>

  <script src="tinymce/tinymce.min.js"></script>

  <script>
    const editorId = "tinymce-editor";
    const editorIdSelector = "#" + editorId;

    tinymce.init({
      selector: editorIdSelector,
      language: "cs",
      entity_encoding: "raw",
      browser_spellcheck: true,
      license_key: "gpl",
      promotion: false,
      branding: false,
      statusbar: false,
      allow_html_in_named_anchor: true,
      resize: false,
      table_use_colgroups: false,
      table_default_attributes: {},
      table_default_styles: {},
      table_sizing_mode: "responsive",
      plugins: 'code charmap image link searchreplace table visualchars lists',
      menubar: "edit view insert format table tools help",
      toolbar: 'alignleft aligncenter alignright | underline bold italic | link subscript superscript | styles bullist numlist',
      toolbar_mode: "sliding",
      width: "100%",
      height: "100vh",
      setup: function(ed) {
        ed.on('init', function() { CefSharp.PostMessage(JSON.stringify({druh: 'pripraven'})); });
        ed.on('input change undo redo', function() {
          if (!nastavuji) CefSharp.PostMessage(getEditorContent());
        });
      }
    });

    let verzeObsahu = 0;
    let poradiZpravy = 0;
    let nastavuji = false;
    function getEditorContent() {
      return JSON.stringify({druh: 'obsah', verze: verzeObsahu, poradi: ++poradiZpravy, html: tinymce.get(editorId).getContent()});
    }
    function setEditorContent(content, verze) {
      nastavuji = true;
      try {
        const editor = tinymce.get(editorId);
        verzeObsahu = verze;
        editor.setContent(content || "");
        editor.undoManager.clear();
        editor.setDirty(false);
      } finally { nastavuji = false; }
    }
  </script>

  <style>
    .tox-editor-header {
      padding: 0px !important;
    }

    .tox-tinymce {
      border: 0px !important;
    }

    .tox-mbtn, .tox-toolbar-overlord {
      margin: 0px !important;
      padding: 0px !important;
    }

    .tox-tbtn {
      margin: 0px 1px !important;
      height: 30px !important;
    }

    .tox-menubar {
      padding-left: 0px !important;
      padding-right: 0px !important;
    }

    .tox-toolbar__group {
      padding-left: 0px !important;
      padding-right: 3px !important;
    }
  </style>
</head>

<body>
  <textarea id="tinymce-editor"></textarea>
</body>

</html>
