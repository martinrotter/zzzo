---
name: zzzo

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["*"]
    tags: ["*"]

permissions:
  contents: read

jobs:
  build-zzzo:
    name: "zzzo: build"
    timeout-minutes: 20
    runs-on: windows-2022

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test GUI, editors, preview and PDF export
        shell: pwsh
        run: .\resources\scripts\test-windows.ps1 -Gui

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: warn
          path: |
            ZZZO/ZZZO.Tests/bin/Release/net10.0-windows7.0/win-x86/publish/test-results/*.png
            ZZZO/ZZZO.Tests/bin/Release/net10.0-windows7.0/win-x86/publish/test-results/*.txt
            ZZZO/ZZZO.Tests/bin/Release/net10.0-windows7.0/win-x86/publish/test-results/*.html
            ZZZO/ZZZO.Tests/bin/Release/net10.0-windows7.0/win-x86/publish/test-results/*.pdf

      - name: Build application
        shell: pwsh
        run: .\resources\scripts\build-windows.ps1

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: ./zzzo.zip

  dist-binaries:
    if: github.event_name == 'push'
    name: "zzzo: distribute"
    needs:
      - build-zzzo
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download binaries from previous jobs
        uses: actions/download-artifact@v8
        with:
          name: zzzo.zip
          path: artifacts
          skip-decompress: true

      - name: Release development binaries
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: artifacts/zzzo.zip
          name: Nejnovější varianta programu
          omitBodyDuringUpdate: true
          prerelease: true
          removeArtifacts: true
          tag: devbuild

      - name: Release stable binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifactErrorsFailBuild: true
          artifacts: artifacts/zzzo.zip
          draft: true
